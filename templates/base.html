<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyTrack | Quản lý Tài chính</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modal.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">MoneyTrack</div>
            </div>

            <nav class="menu">
                <div class="nav-group">
                    <a href="{{ url_for('dashboard') }}" class="nav-item {% if page == 'dashboard' %}active{% endif %}">
                        <span class="icon"></span> Dashboard
                    </a>

                    <div id="finance-parent" class="nav-item parent-item {% if page in ['thu_chi', 'vay_no'] %}active open{% endif %}">
                        <span class="icon"></span> Quản lý tài chính <span class="toggle-icon">▼</span>
                    </div>
                    
                    <div id="finance-submenu" class="submenu {% if page in ['thu_chi', 'vay_no'] %}open{% endif %}">
                        <a href="{{ url_for('thu_chi') }}" class="sub-item {% if page == 'thu_chi' %}active{% endif %}">
                            Thu Chi
                        </a>
                        <a href="{{ url_for('vay_no') }}" class="sub-item {% if page == 'vay_no' %}active{% endif %}">
                            Vay Nợ
                        </a>
                    </div>
                </div>
            </nav>

            <div class="sidebar-footer">
                <button class="btn btn-logout">Đăng xuất</button>
            </div>
        </aside>
        
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    <div id="ai-widget-container">
        <div id="ai-chat-window" class="ai-chat-hidden">
            <div class="ai-chat-header">
                <strong>✨ MoneyTrack AI</strong>
                <button id="close-chat" style="background:none; border:none; color:white; cursor:pointer; font-size:20px;">&times;</button>
            </div>
            
            <div class="ai-chat-body" id="ai-chat-content">
                <div class="message ai-msg">
                    Xin chào! Tôi là AI trợ lý tài chính. Hôm nay bạn đã chi tiêu những gì? Hãy cho tôi biết nhé
                </div>
            </div>

            <div class="ai-chat-footer">
                <input type="text" id="ai-chat-input" placeholder="Nhắn tin cho AI...">
                <button id="btn-ai-send">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
            </div>
        </div>
        <button id="ai-float-button">✨</button>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
